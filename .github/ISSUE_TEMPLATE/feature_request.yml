name: Feature request
description: Propose a bounded Kinetic capability or architecture change
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and authority boundaries
      description: Note any impact on permissions, tools, credentials, routing, native code, persistence, or Android capabilities.
    validations:
      required: true
