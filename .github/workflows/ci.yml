name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kinetic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          CMAKE_ARCHIVE="$RUNNER_TEMP/cmake-3.30.2-linux-x86_64.tar.gz"
          CMAKE_DIR="$RUNNER_TEMP/cmake-3.30.2-linux-x86_64"
          curl --fail --location --retry 3 --output "$CMAKE_ARCHIVE" \
            "https://github.com/Kitware/CMake/releases/download/v3.30.2/cmake-3.30.2-linux-x86_64.tar.gz"
          echo "cdd7fb352605cee3ae53b0e18b5929b642900e33d6b0173e19f6d4f2067ebf16  $CMAKE_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$CMAKE_ARCHIVE" -C "$RUNNER_TEMP"

          sudo apt-get update
          sudo apt-get install -y ninja-build

          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$SDK_ROOT" "$CMAKE_DIR" > local.properties
          "$CMAKE_DIR/bin/cmake" --version
          ninja --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run host verification gate
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            --no-parallel \
            -Pkotlin.compiler.execution.strategy=in-process \
            :core:kernel:test \
            :data:model:testDebugUnitTest \
            :data:android-capabilities:testDebugUnitTest \
            :app:testDebugUnitTest \
            verifyDeviceTestSafety \
            lintDebug \
            assembleDebug
